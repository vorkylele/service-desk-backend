services:
  db:
    image: postgres:16-alpine
    container_name: servicedesk-db
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: servicedesk
    ports:
      - "5433:5432"
    volumes:
      - servicedesk-data:/var/lib/postgresql/data
volumes:
  servicedesk-data:
